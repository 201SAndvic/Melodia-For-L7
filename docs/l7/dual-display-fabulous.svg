<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Melodia For L7 dual-display layout — Fabulous by BLU-SWING</title>
  <desc id="desc">A portrait driver screen and a wide passenger screen show the same song and playback position. Layout illustration.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#1b2225"/><stop offset="1" stop-color="#101315"/>
    </linearGradient>
    <linearGradient id="screen" x2="0" y2="100%">
      <stop stop-color="#1d4141"/><stop offset="1" stop-color="#111617"/>
    </linearGradient>
    <linearGradient id="cover" x2="100%" y2="100%">
      <stop stop-color="#224b67"/><stop offset="1" stop-color="#19504d"/>
    </linearGradient>
    <g id="art">
      <rect width="100" height="100" rx="8" fill="url(#cover)"/>
      <circle cx="50" cy="50" r="34" fill="#102429" stroke="#64aaa1"/>
      <circle cx="50" cy="50" r="26" fill="none" stroke="#31565b"/>
      <circle cx="50" cy="50" r="18" fill="none" stroke="#31565b"/>
      <path d="M28 53h8l6-13 8 23 8-19 6 9h8" fill="none" stroke="#a9f6db" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="controls" fill="#f4f6f7">
      <path d="M-51 -6v12h-2V-6z M-40 -6V6l-10-6z M51 -6v12h2V-6z M40 -6V6l10-6z"/>
      <rect x="-28" y="-11" width="56" height="22" rx="11"/>
      <path d="M-4 -4v8M4 -4v8" stroke="#121618" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <g id="progress">
      <path d="M0 0h168" stroke="#536266" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 0h47" stroke="#b5f0db" stroke-width="3" stroke-linecap="round"/>
      <circle cx="47" cy="0" r="4" fill="#b5f0db"/>
    </g>
  </defs>
  <rect width="1120" height="460" rx="22" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="39" fill="#f3f6f6" font-size="20" font-weight="700">MELODIA FOR L7</text>
    <text x="1080" y="38" fill="#aebdc0" text-anchor="end" font-size="13" letter-spacing="1.3">DUAL DISPLAY · LAYOUT DEMO</text>
    <text x="40" y="71" fill="#a9efda" font-size="14" font-weight="700">01  DRIVER DISPLAY</text>
    <text x="286" y="71" fill="#aebdc0" font-size="13" text-anchor="end">1440 × 1920</text>
    <text x="352" y="111" fill="#a9efda" font-size="14" font-weight="700">02  PASSENGER DISPLAY</text>
    <text x="1080" y="111" fill="#aebdc0" font-size="13" text-anchor="end">2880 × 1080</text>
    <!-- The portrait and wide frames use the real panels' 3:4 and 8:3 aspect ratios. -->
    <rect x="40" y="83" width="246" height="328" rx="16" fill="url(#screen)" stroke="#5e7878"/>
    <rect x="352" y="125" width="728" height="273" rx="16" fill="url(#screen)" stroke="#5e7878"/>
    <text x="163" y="106" fill="#c3d2d4" text-anchor="middle" font-size="11" letter-spacing="1.7">NOW PLAYING</text>
    <use href="#art" x="100" y="119" transform="translate(-28 -33.32) scale(1.28)"/>
    <text x="79" y="274" fill="#f6f7f7" font-size="24" font-weight="700">Fabulous</text>
    <text x="79" y="295" fill="#b8c6c8" font-size="13">BLU-SWING</text>
    <use href="#progress" transform="translate(79 316)"/>
    <text x="79" y="337" fill="#c1cdce" font-size="12">1:10</text>
    <text x="247" y="337" fill="#c1cdce" font-size="12" text-anchor="end">4:11</text>
    <use href="#controls" transform="translate(163 369)"/>
    <use href="#art" x="0" y="0" transform="translate(422 146) scale(1.16)"/>
    <text x="396" y="289" fill="#f6f7f7" font-size="24" font-weight="700">Fabulous</text>
    <text x="396" y="311" fill="#b8c6c8" font-size="13">BLU-SWING</text>
    <use href="#progress" transform="translate(396 328)"/>
    <text x="396" y="347" fill="#c1cdce" font-size="12">1:10</text>
    <text x="564" y="347" fill="#c1cdce" font-size="12" text-anchor="end">4:11</text>
    <use href="#controls" transform="translate(480 371)"/>
    <rect x="606" y="148" width="450" height="225" rx="14" fill="#272727"/>
    <text x="631" y="180" fill="#f2f3f3" font-size="16" font-weight="700">Lyrics preview</text>
    <g fill="#656b6c">
      <rect x="631" y="201" width="240" height="7" rx="3.5"/>
      <rect x="631" y="222" width="194" height="7" rx="3.5"/>
      <rect x="631" y="267" width="207" height="7" rx="3.5"/>
      <rect x="631" y="288" width="230" height="7" rx="3.5"/>
    </g>
    <rect x="631" y="242" width="285" height="10" rx="5" fill="#d8e0df"/>
    <rect x="631" y="318" width="99" height="30" rx="15" fill="#ebeeee"/>
    <text x="680" y="337" fill="#171b1d" text-anchor="middle" font-size="12" font-weight="700">Show lyrics</text>
    <!-- Link symbol between the screens denotes shared playback, not a mirrored layout. -->
    <path d="M287 247h63" stroke="#80c5b1" stroke-width="1.6" stroke-dasharray="3 4"/>
    <circle cx="319" cy="247" r="12" fill="#1a2d2b" stroke="#80c5b1"/>
    <path d="M315 247h8m-7-3-3 3 3 3m6-6 3 3-3 3" fill="none" stroke="#b5f0db" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="560" y="436" fill="#b9cbca" text-anchor="middle" font-size="14">One player · Same track and playback position · Independent layouts</text>
  </g>
</svg>
